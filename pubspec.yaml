name: tracking_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  get_it: ^9.2.1
  injectable:
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^11.1.1
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.2
  easy_localization: ^3.0.8
  go_router: ^18.0.1
  lottie: ^3.6.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  cached_network_image: ^4.0.4
  flutter_svg: ^2.3.0
  geolocator: ^14.1.1
  json_annotation: ^4.12.0
  flutter_bloc:
  retrofit:
  freezed_annotation:
  flutter_native_splash:
  shimmer:
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner:
  injectable_generator:
  retrofit_generator:
  json_serializable: ^6.15.2
  freezed:
  mockito:
  bloc_test:

flutter:
  uses-material-design: true

  assets:
    - assets/translations/en.json
    - assets/translations/ar.json
    - assets/animations/
    - assets/images/
    - .env